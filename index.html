<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f4f"><title>EarthOnline · Live Your Second Life</title><link rel="icon" type="image/png" href="/branding/earth-online-mark.png"><link rel="apple-touch-icon" href="/branding/earth-online-mark.png"></head>
<body><main id="app">
  <header><img class="wordmark" src="/branding/earth-online-badge.png" alt="EarthOnline"><span class="divider"></span><label class="city-select">城市 <select id="city" aria-label="选择城市"></select></label><nav><button id="activities">生活工坊</button><button id="arcade">街区挑战</button><button id="room">布置房间</button></nav></header>
  <section id="viewport" aria-label="城市三维场景"><div id="scene"></div><aside class="location"><strong id="district"></strong><span id="area"></span></aside>
    <div id="status" role="status">载入街区中…</div>
    <div class="tools" aria-label="视角和探索工具"><button id="overview" aria-pressed="true">鸟瞰</button><button id="walk" aria-pressed="false">步行</button><button id="ride">开车</button><button id="time">夜景</button><button id="photo">拍照</button><button id="home">回到起点</button><button id="appearance" title="切换角色">换角色</button><button id="peers" aria-pressed="false">联机</button></div>
    <div id="touch" aria-label="方向键"><button data-key="KeyW" aria-label="向前">↑</button><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="向后">↓</button><button data-key="KeyD" aria-label="向右">→</button><button data-key="Space" aria-label="跳跃或手刹">␣</button></div>
  </section><footer><span id="metric"></span><span id="hint">拖动旋转 · 滚轮缩放 · WASD 平移</span><a href="./maps/credits.html" target="_blank" rel="noopener">地图来源 ↗</a></footer>
</main><section id="overlay" hidden aria-label="活动"></section><script type="module" src="/src/main.ts"></script></body></html>
